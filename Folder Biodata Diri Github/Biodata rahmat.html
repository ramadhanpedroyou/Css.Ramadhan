<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .inputText {
            color: darkblue; /* Mengubah warna text menjadi biru tua */
            font-family: Calibri, sans-serif; /* Mengubah font menjadi Calibri */
            background-color: lightblue; /* Mengubah background menjadi biru terang */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form>
        <h2>Student Name</h2>
        <label>First Name</label>
        <input type="text" name="First Name" class="inputText">
        
        <label>Last Name</label>
        <input type="text" name="Last Name" class="inputText">
        
        <h2>Gender</h2>
        <input type="text" value="Please Select" class="inputText">
        <select>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select>
    </form>
</body>
</html>
